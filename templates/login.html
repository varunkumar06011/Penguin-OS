                    <video autoplay muted loop playsinline preload="auto" poster="/static/images/penguin-os-logo.jpg" onerror="this.style.display='none'">
                        <source src="/static/images/login-hero.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>
            <div id="downloadAppMsg" class="download-app-msg"></div>
        </div>
    </div>

    <div id="portalStep" class="login-portals">
            <button type="button" class="portal-btn" data-role="supervisor">
                <span class="portal-icon">SP</span>
                <span class="portal-name">Supervisor</span>
                <span class="portal-desc">Update cell status & track progress</span>
            </button>
            <button type="button" class="portal-btn" data-role="manager">
                <span class="portal-icon">MG</span>
                <span class="portal-name">Manager</span>
                <span class="portal-desc">Invoices, POs, payroll & inventory</span>
            </button>
            <button type="button" class="portal-btn" data-role="admin">
                <span class="portal-icon">AD</span>
                <span class="portal-name">Admin</span>
                <span class="portal-desc">Full access, reports & settings</span>
            </button>
            <button type="button" class="portal-btn" data-role="security">
                <span class="portal-icon">SC</span>
                <span class="portal-name">Security</span>
                <span class="portal-desc">Visitor entry & resident verification</span>
            </button>
            <button type="button" class="portal-btn" data-role="resident">
                <span class="portal-icon">RE</span>
                <span class="portal-name">Resident</span>
                <span class="portal-desc">Approve visitors & view history</span>
            </button>
        </div>

        <form id="loginForm" class="login-form" style="display:none;">
            <div class="login-fields">
                <div class="login-role-indicator">
                    <span class="portal-icon small" id="loginRoleIcon">SP</span>
                    <span id="selectedRoleName">Supervisor</span>
                    <button type="button" id="backToPortals" class="back-to-portals">Change role</button>
                </div>
                <div id="mainLoginFields">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                        <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:0.85rem;color:#666;cursor:pointer;">
                            <input type="checkbox" id="showPasswordToggle" style="width:auto;"> Show password
                        </label>
                    </div>
                </div>
                <div id="securityLoginFields" style="display:none;">
                    <div class="form-group">
                        <label for="securityEmail">Email</label>
                        <input type="email" id="securityEmail" name="securityEmail">
                    </div>
                    <div class="form-group">
                        <label for="securityPassword">Password</label>
                        <input type="password" id="securityPassword" name="securityPassword">
                    </div>
                </div>
                <div id="residentLoginFields" style="display:none;">
                    <div class="form-group">
                        <label for="residentMobile">Mobile Number</label>
                        <input type="tel" id="residentMobile" name="residentMobile" placeholder="Registered mobile number">
                    </div>
                </div>
                <div class="error-msg" id="loginError"></div>
                <button type="submit" class="btn-primary" id="loginSubmitBtn">Sign In</button>
            </div>
        </form>

        <div class="login-get-started">
            <span>New construction?</span>
            <a href="#" id="getStartedLink">Get started</a>
            <span id="comingSoonMsg" class="coming-soon-msg">Coming soon</span>
        </div>

        <div class="login-footer">
            Powered by <strong>VTechnologies</strong>
        </div>
    </div>
<script>
        // GitHub release config â€” update these to your repo details
        const GITHUB_OWNER = 'Varunkumar06011';
        const GITHUB_REPO = 'vgrand-infra-tracking';
        const APK_ASSET_NAME = 'penguin-os.apk';

        let selectedPortalRole = 'supervisor';

        function getPortalIcon(role) {
            if (role === 'supervisor') return 'SP';
            if (role === 'manager') return 'MG';
            if (role === 'admin') return 'AD';
            if (role === 'security') return 'SC';
            if (role === 'resident') return 'RE';
            return 'Â·';
        }

        document.querySelectorAll('.portal-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.portal-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedPortalRole = btn.dataset.role;

                // Clear forms
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                document.getElementById('securityEmail').value = '';
                document.getElementById('securityPassword').value = '';
                document.getElementById('residentMobile').value = '';
                document.getElementById('loginError').textContent = '';

                // Show correct fields
                const isMain = ['supervisor','manager','admin'].includes(selectedPortalRole);
                const isSecurity = selectedPortalRole === 'security';
                const isResident = selectedPortalRole === 'resident';

                document.getElementById('mainLoginFields').style.display = isMain ? '' : 'none';
                document.getElementById('securityLoginFields').style.display = isSecurity ? '' : 'none';
                document.getElementById('residentLoginFields').style.display = isResident ? '' : 'none';

                document.getElementById('username').required = isMain;
                document.getElementById('password').required = isMain;
                document.getElementById('securityEmail').required = isSecurity;
                document.getElementById('securityPassword').required = isSecurity;
                document.getElementById('residentMobile').required = isResident;

                // Focus first field
                if (isMain) document.getElementById('username').focus();
                else if (isSecurity) document.getElementById('securityEmail').focus();
                else if (isResident) document.getElementById('residentMobile').focus();

                // Update role indicator
                const indicator = document.querySelector('.login-role-indicator');
                if (indicator) {
                    indicator.querySelector('#loginRoleIcon').textContent = getPortalIcon(selectedPortalRole);
                    indicator.querySelector('#selectedRoleName').textContent = btn.querySelector('.portal-name').textContent;
                }

                // Show form, hide portal cards
                document.getElementById('portalStep').style.display = 'none';
                document.getElementById('loginForm').style.display = '';
            });
        });

        document.getElementById('backToPortals').addEventListener('click', () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('portalStep').style.display = '';
            document.querySelectorAll('.portal-btn').forEach(b => b.classList.remove('active'));
        });

        document.getElementById('getStartedLink').addEventListener('click', (e) => {
            e.preventDefault();
            const msg = document.getElementById('comingSoonMsg');
            msg.style.display = 'inline';
            setTimeout(() => { msg.style.display = 'none'; }, 2000);
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = '';

            try {
                let resp, data;
                if (['supervisor','manager','admin'].includes(selectedPortalRole)) {
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;
                    resp = await fetch('/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    data = await resp.json();
                    if (data.success) {
                        window.location.href = '/';
                        return;
                    }
                } else if (selectedPortalRole === 'security') {
                    const email = document.getElementById('securityEmail').value;
                    const password = document.getElementById('securityPassword').value;
                    if (!email || !password) { errorDiv.textContent = 'Email and password are required'; return; }
                    resp = await fetch('/api/visitor/security-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    data = await resp.json();
                    if (data.success) {
                        window.location.href = '/visitor-portal';
                        return;
                    }
                } else if (selectedPortalRole === 'resident') {
                    const mobile = document.getElementById('residentMobile').value;
                    if (!mobile) { errorDiv.textContent = 'Mobile number is required'; return; }
                    resp = await fetch('/api/visitor/resident-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mobile })
                    });
                    data = await resp.json();
                    if (data.success) {
                        window.location.href = '/visitor-portal';
                        return;
                    }
                }
                errorDiv.textContent = data && data.error ? data.error : 'Login failed';
            } catch (err) {
                errorDiv.textContent = 'Network error. Please try again.';
            }
        });

        document.getElementById('showPasswordToggle').addEventListener('change', (e) => {
            const pass = document.getElementById('password');
            if (pass) pass.type = e.target.checked ? 'text' : 'password';
        });

        document.getElementById('downloadAppBtn').addEventListener('click', async () => {
            const btn = document.getElementById('downloadAppBtn');
            const msg = document.getElementById('downloadAppMsg');
            msg.textContent = '';

            if (GITHUB_OWNER === 'YOUR_GITHUB_USERNAME' || GITHUB_REPO === 'YOUR_REPO_NAME') {
                msg.textContent = 'App download is not configured yet. Please set GitHub owner and repo.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Getting latest app...';
            try {
                const r = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases/latest`);
                if (!r.ok) throw new Error('Could not fetch latest release.');
                const release = await r.json();
                const asset = release.assets && release.assets.find(a => a.name === APK_ASSET_NAME);
                if (!asset) throw new Error(`APK asset "${APK_ASSET_NAME}" not found in release ${release.tag_name}.`);

                const link = document.createElement('a');
                link.href = asset.browser_download_url;
                link.download = asset.name;
                document.body.appendChild(link);
                link.click();
                link.remove();

                msg.style.color = '#27ae60';
                msg.textContent = `Downloading ${asset.name} (${release.tag_name})...`;
            } catch (err) {
                msg.style.color = '#c0392b';
                msg.textContent = err.message || 'Download failed. Please try again later.';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '&#8659; Download App';
            }
        });
    </script>
</body>
</html>
